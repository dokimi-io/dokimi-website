{% extends "main.html" %}

{% block tabs %}
  {{ super() }}
  <section class="dk-hero">
    <div class="dk-hero__inner md-grid md-typeset">
      <img class="dk-hero__banner"
           src="{{ 'assets/images/banner.jpg' | url }}"
           width="2000" height="1116"
           alt="The dokimi vaquita, wearing a headset, between two Kubernetes nodes, with test traffic passing from one pod to the other, above the name dokimi and the words performance testing for Kubernetes">
      <p class="dk-hero__lead">
        Performance tests for your Kubernetes cluster, against criteria you can read.
        Today, dokimi measures the network between two of its nodes.
      </p>
      <div class="dk-hero__actions">
        <a href="{{ 'getting-started/' | url }}" class="md-button md-button--primary">Get started</a>
        <a href="{{ 'how-it-works/' | url }}" class="md-button">How it works</a>
      </div>
    </div>
  </section>
{% endblock %}

{% block content %}
  {{ page.content }}
{% endblock %}
